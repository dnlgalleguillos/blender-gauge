<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256" role="img" aria-label="Blender Agent Skills">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf0dc"/><stop offset="1" stop-color="#2cc4b0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a9d93"/><stop offset="1" stop-color="#1a6f78"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4fd0"/><stop offset="1" stop-color="#352a8f"/>
    </linearGradient>
  </defs>
  <!-- cube: top, left and right faces -->
  <g stroke="#14172e" stroke-width="10" stroke-linejoin="round">
    <path d="M256 70 L405 156 L256 242 L107 156 Z" fill="url(#top)"/>
    <path d="M107 156 L256 242 L256 424 L107 338 Z" fill="url(#left)"/>
    <path d="M405 156 L405 338 L256 424 L256 242 Z" fill="url(#right)"/>
  </g>
  <!-- node graph over the cube -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <path d="M170 290 C 210 290, 214 330, 256 330"/>
    <path d="M256 330 C 300 330, 304 270, 346 270"/>
    <path d="M170 290 C 190 240, 230 190, 256 156"/>
  </g>
  <g stroke="#14172e" stroke-width="8">
    <circle cx="170" cy="290" r="21" fill="#ffffff"/>
    <circle cx="256" cy="330" r="21" fill="#ffd166"/>
    <circle cx="346" cy="270" r="21" fill="#ffffff"/>
    <circle cx="256" cy="156" r="19" fill="#ff6b8b"/>
  </g>
  <!-- spark: the agent -->
  <path d="M430 40 L441 76 L477 87 L441 98 L430 134 L419 98 L383 87 L419 76 Z" fill="#ffd166" stroke="#14172e" stroke-width="7" stroke-linejoin="round"/>
</svg>
